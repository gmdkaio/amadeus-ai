[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-ai"
version = "0.1.0"
description = "QLoRA persona fine-tune of Qwen 2.5 with local inference and voice synthesis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # LLM inference and training
    "torch",
    "transformers",
    "unsloth",
    "trl",
    "bitsandbytes",
    "accelerate",
    "datasets>=4.4",
    "dill>=0.4.1",
    "multiprocess>=0.70.19",

    # Voice (GPT-SoVITS client) and audio processing
    "requests",
    "soundfile",
    "librosa",
    "numba",
]

[project.scripts]
amadeus = "amadeus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
