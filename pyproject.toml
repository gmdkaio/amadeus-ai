[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-ai"
version = "0.1.0"
description = "Steins;Gate Amadeus AI - Kurisu Makise LLM and Voice clone"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # NLP & LLM Training (Phase 1 & 2)
    "torch",
    "transformers",
    "unsloth",
    "trl",
    "bitsandbytes",
    "accelerate",
    "datasets>=4.4",
    "dill>=0.4.1",
    "multiprocess>=0.70.19",
    
    # Audio Processing & Voice Cloning (Phase 3 Preview)
    "soundfile",
    "librosa",
    "numba"
]

[project.scripts]
# Custom terminal commands!
amadeus-chat = "tools.training.test_inference:test_kurisu"
amadeus-train = "tools.training.train_lora:train_amadeus"
amadeus-format = "tools.extraction.format_dataset:build_dataset"

[tool.setuptools.packages.find]
include = ["tools*"]
